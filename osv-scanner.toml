# Reviewed vulnerability suppressions. Each entry needs a reason and an expiry.
#
# BASELINE 2026-11-14: every advisory below was found by the first full scan and is
# suppressed until 2026-12-14 so the pipeline can gate NEW findings. Fix them in a
# follow-up dependency-bump PR and delete the entries; do not extend without review.
#
# MAVEN: osv-scanner does not read pom.xml. Its own resolver intermittently failed to
# fetch the Micronaut parent POM and, when it worked, resolved BOM-managed versions that
# differ from what Maven ships. Instead the OSV step (cicd/steps/security.py) has Maven
# (pinned Docker image) write the resolved compile/runtime tree as a CycloneDX SBOM to
# java-webservice-template/target/bom.json and scans that with --sbom. The step fails if
# the SBOM is not produced. Some older Maven reasons below name the versions osv's pom
# resolution guessed (e.g. 2.18.0); the IDs are still matched by the resolved versions.

# ---- Maven (java-webservice-template, resolved CycloneDX SBOM) ----
