[[IgnoredVulns]]
id = "RUSTSEC-2026-0440"
ignoreUntil = 2026-12-14
reason = "astral-tokio-tar 0.6.4 in rust-webservice-template/Cargo.lock via testcontainers 0.27.3 (dev-dependency; cargo tree -i astral-tokio-tar); unmaintained notice, not a vulnerability, and no fixed release as of 2026-11-16 (testcontainers 0.28.0 still requires ^0.6.1); compiled only into the integration-test binary, never into the shipped service; re-triaged at Rust promotion 2026-11-16; fix in follow-up dependency-bump PR"

# Not-compiled / not-reachable code paths (verified with cargo tree); reviewed 2026-11-14; Rust entries re-checked at Rust promotion 2026-11-16.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0457"
ignoreUntil = 2027-02-14
reason = "rmcp 2.2.0 OAuth client SSRF; rust-webservice-template enables only rmcp server + transport-streamable-http-server features (cargo tree -e features -i rmcp, re-checked 2026-11-16 after R1-R4: server, server-side-http, transport-streamable-http-server[-session], macros and their defaults; no auth, client or reqwest features), so the vulnerable OAuth client code is not compiled. Fix is rmcp 3.7+ (major: sessionless MCP 2026-07-28 migration) - follow-up; review 2027-02-14"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0462"
ignoreUntil = 2027-02-14
reason = "rmcp 2.2.0 unbounded body buffering in Streamable HTTP *clients* (transport-streamable-http-client-reqwest / -unix-socket); rust-webservice-template enables only server features (cargo tree -e features -i rmcp, re-checked 2026-11-16: no client transports), so the client code is not compiled; the server's own request bodies are capped by tower-http's limit layer. Fix is rmcp 3.9+ (major migration) - follow-up; review 2027-02-14"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-14
reason = "chrono 0.4.45 in rust-webservice-template/Cargo.lock: unmaintained notice, not a vulnerability, no fixed release. Required by arrow, rmcp and schemars, none of which offers a replacement yet. Same decision as rust-webservice-template/deny.toml; re-check at the next dependency bump; review 2027-02-14"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-14
reason = "libsqlite3-sys 0.37.0 is in rust-webservice-template/Cargo.lock only through sqlx-sqlite, which Cargo always locks for sqlx's weak optional dependencies (rust-lang/cargo#10801) but never compiles here: sqlx is built with default-features = false and only the postgres feature, and `cargo tree -i libsqlite3-sys --target all -e all --all-features` prints nothing (checked 2026-11-19). cargo-deny, which reads the build graph, does not report it. Review 2027-02-14"

