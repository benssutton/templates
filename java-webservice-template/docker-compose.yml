name: java-template
services:
  postgres:
    image: pgvector/pgvector:0.8.4-pg18
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_PASSWORD: clickhouse   # clickhouse-jdbc rejects an empty password; set an explicit one
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./src/main/resources/db/clickhouse-init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/clickhouse-seed.sh:/docker-entrypoint-initdb.d/02-seed.sh
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
  redis:
    image: redis/redis-stack-server:latest
  solace:
    image: solace/solace-pubsub-standard:10.26.10
    ports:
      - "55555:55555"
      - "8080:8080"
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      # Minimum scaling tier (~1 GiB) so the broker fits a dev-sized Docker VM.
      system_scaling_maxconnectioncount: "100"
    # Solace POST hard requirement: nofile hard limit >= 1048576 (older
    # 2448:6592 values trigger a startup ERROR and immediate shutdown).
    shm_size: "1g"
    ulimits:
      core: -1
      nofile:
        soft: 1048576
        hard: 1048576
    # Readiness gate: the guaranteed-messaging health-check port returns 200
    # once the broker is active. (SEMP on 8080 returns 401 without auth, so it
    # is not a usable unauthenticated health probe.)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5550/health-check/guaranteed-active || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  solace-publisher:
    image: java-template-app
    command: ["java", "-cp", "app.jar", "com.example.template.publisher.ExampleSolacePublisher"]
    # The broker's health check reports active before the message VPN accepts
    # clients, and this demo publisher doesn't retry its connect: restart it.
    restart: on-failure
    environment:
      SOLACE_HOST: solace
      SOLACE_TOPIC: ingest/batches
      PUBLISH_INTERVAL_MS: "100"
    depends_on:
      solace: { condition: service_healthy }
      app: { condition: service_started }   # image is built by `app`
  app:
    image: java-template-app
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_started }
      redis: { condition: service_started }
      solace: { condition: service_healthy }
    ports:
      - "443:443"
    environment:
      MICRONAUT_ENVIRONMENTS: docker
      INGEST_TRANSPORT: ${INGEST_TRANSPORT:-solace}
      CLICKHOUSE_PASSWORD: clickhouse
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
