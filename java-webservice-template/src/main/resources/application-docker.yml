# Container profile. Store and broker addresses come from the shared env vars
# (POSTGRES_URL, CLICKHOUSE_HOST, REDIS_URL, SOLACE_HOST, ... see docker-compose.yml).
micronaut:
  server:
    ssl:
      enabled: true
      port: ${SERVER_PORT:8443}   # published as 443 by compose
      key-store:
        path: file:/app/certs/keystore.p12
        type: PKCS12
        password: ${KEYSTORE_PASSWORD:changeit}
