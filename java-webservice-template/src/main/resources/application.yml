micronaut:
  application:
    name: ${OTEL_SERVICE_NAME:java-template}
  server:
    port: ${SERVER_PORT:8443}
    max-request-size: ${MAX_REQUEST_BODY_BYTES:16777216}
    cors:
      enabled: true
      configurations:
        default:
          allowed-origins: ${CORS_ALLOW_ORIGINS:*}
          allowed-methods: ${CORS_ALLOW_METHODS:*}
          allowed-headers: ${CORS_ALLOW_HEADERS:*}
          allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  # SIGTERM: stop accepting, let in-flight requests finish (bounded), then close beans.
  lifecycle:
    graceful-shutdown:
      enabled: true
      grace-period: ${SHUTDOWN_GRACE_PERIOD:20s}
  # Wire contract shared with the Python and Rust templates: snake_case fields, nulls
  # and empty lists written out (the serde default NON_EMPTY would drop "rows": []).
  serde:
    property-naming-strategy: SNAKE_CASE
    serialization:
      inclusion: ALWAYS
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  # MCP over Streamable HTTP at /mcp (micronaut-mcp on the official MCP Java SDK).
  mcp:
    server:
      transport: HTTP
      endpoint: /mcp
      info:
        name: ${template.mcp-name}
        version: ${template.app-version}
  # Bearer-JWT auth seam (template.auth.*). Off by default; when on, every route needs
  # Authorization: Bearer <HS256 JWT> except the orchestrator probes.
  security:
    enabled: ${template.auth.enabled}
    token:
      jwt:
        claims-validators:
          # Python and Rust accept tokens without sub; iss/aud come from EnvContract.
          subject-not-null: false
        signatures:
          secret:
            generator:
              secret: ${template.auth.jwt-secret}
              jws-algorithm: HS256
    intercept-url-map:
      - pattern: /health/live
        access: isAnonymous()
      - pattern: /health/ready
        access: isAnonymous()
      - pattern: /**
        access: isAuthenticated()
  metrics:
    enabled: ${METRICS_ENABLED:true}
    binders:
      jvm:
        enabled: true
      processor:
        enabled: true
      uptime:
        enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M

endpoints:
  # MetricsController serves the Prometheus scrape at /metrics; the built-in
  # /prometheus and JSON /metrics management endpoints would duplicate it.
  prometheus:
    enabled: false
  metrics:
    enabled: false

# OpenTelemetry tracing: an inbound W3C traceparent is always propagated; spans are created
# and exported only when OTEL_TRACES_EXPORTER=otlp (endpoint OTEL_EXPORTER_OTLP_ENDPOINT).
# With export off the SDK (1.68+) creates no spans at all.
otel:
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:`http://localhost:4317`}

# Logging level for the application packages.
logger:
  levels:
    com.example.template: ${LOG_LEVEL:INFO}

template:
  auth:
    enabled: ${AUTH_ENABLED:false}
    jwt-secret: ${AUTH_JWT_SECRET:}
  app-title: ${APP_TITLE:Template Micronaut Service}
  app-version: ${APP_VERSION:1.0.0}
  app-description: ${APP_DESCRIPTION:A Java Micronaut service mirroring the Python webservice template}
  status: "running"
  correlation-id-header: ${CORRELATION_ID_HEADER:X-Request-ID}
  health-check-timeout-seconds: ${HEALTH_CHECK_TIMEOUT_SECONDS:2.0}
  # /health/status and /metrics reuse one probe round this long (readiness is always live).
  health-cache-ttl-seconds: ${HEALTH_CACHE_TTL_SECONDS:5}
  mcp-name: ${MCP_NAME:java-template}
  mcp-instructions: ${MCP_INSTRUCTIONS:Tools for this template application. Each tool mirrors a read-only REST endpoint.}
  # /mcp DNS-rebinding protection (McpHostFilter): allowed Host header values; Origin is
  # checked against the same hosts. An entry without a port matches any port. Comma-separated
  # or a JSON array (see EnvContract). Must not be empty; a bad entry fails startup.
  mcp-allowed-hosts: ${MCP_ALLOWED_HOSTS:localhost}
  connect-max-attempts: ${CONNECT_MAX_ATTEMPTS:5}
  connect-base-delay-seconds: ${CONNECT_BASE_DELAY:1.0}
  connect-max-delay-seconds: ${CONNECT_MAX_DELAY:30.0}
  ingest:
    transport: ${INGEST_TRANSPORT:noop}   # noop (HTTP ingest only) | solace
    max-batch-bytes: ${MAX_INGEST_BATCH_BYTES:16777216}
    # Watchdog: exit when the transport stays disconnected this long (0 disables).
    max-disconnect-seconds: ${INGEST_MAX_DISCONNECT_SECONDS:60}
    # Exit after this many transport failures in a row without a bind (0 disables).
    max-consecutive-failures: ${INGEST_MAX_CONSECUTIVE_FAILURES:5}
    staleness-threshold-seconds: ${INGEST_STALENESS_THRESHOLD_SECONDS:0}
    # Stale ingest fails /health/ready only when this is true.
    stale-fails-readiness: ${INGEST_STALE_FAILS_READINESS:false}
    lsm-max-rows: ${LSM_MAX_ROWS:1000000}   # retention cap for the LSM store (oldest live rows evicted)
    lsm-flush-rows: ${LSM_FLUSH_ROWS:1000}   # memtable -> sorted run threshold
    lsm-compaction-runs: ${LSM_COMPACTION_RUNS:4}   # run count -> full compaction threshold
    lsm-key-columns: ${LSM_KEY_COLUMNS:id}   # merge key; the Java store supports id only
    decoder-memory-bytes: 268435456   # direct memory bound shared by all Arrow decodes
    retry-base-delay-seconds: ${INGEST_RETRY_BASE_DELAY:1.0}
    retry-max-delay-seconds: ${INGEST_RETRY_MAX_DELAY:60.0}
    solace:
      host: ${SOLACE_HOST:localhost}
      port: ${SOLACE_PORT:55555}
      vpn: ${SOLACE_VPN:default}
      username: ${SOLACE_USERNAME:admin}
      password: ${SOLACE_PASSWORD:admin}
      topic: ${SOLACE_TOPIC:ingest/batches}
      queue: ${SOLACE_QUEUE:java-template/ingest}   # durable exclusive; one per replica

# Every store client has bounded waits, so an outage is a prompt 503, not a hung request.
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/appdb
    username: appuser
    password: password
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    minimum-idle: ${POSTGRES_POOL_MIN_SIZE:2}
    maximum-pool-size: ${POSTGRES_POOL_MAX_SIZE:10}
    connection-timeout: 3000      # ms to wait for a pooled connection
    validation-timeout: 1000
    data-source-properties:
      connectTimeout: 3           # s (pgjdbc)
      socketTimeout: 10           # s: a frozen server cannot hold a request longer
      options: "-c statement_timeout=5000"
  clickhouse:
    url: jdbc:ch://localhost:8123/default
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    dialect: ANSI
    schema-generate: NONE
    minimum-idle: 1
    maximum-pool-size: ${CLICKHOUSE_POOL_SIZE:10}
    connection-timeout: 3000
    validation-timeout: 1000
    data-source-properties:
      # Quoted: the client-v2 driver rejects non-string property values.
      connection_timeout: "3000"  # ms
      socket_timeout: "10000"     # ms
      clickhouse_setting_max_execution_time: "5"   # s, enforced by the server
      # ClickHouse has no transactions; Micronaut's transaction manager (and
      # @MicronautTest's per-test transaction) still calls setAutoCommit(false).
      # Accept such calls as no-ops instead of throwing.
      jdbc_ignore_unsupported_values: "true"

# Postgres schema: versioned Flyway migrations in db/postgres, applied at startup. Flyway
# holds a Postgres advisory lock while migrating, so replicas starting together are safe.
# A database created before migrations existed is baselined at version 0 and V1 (all
# IF NOT EXISTS) re-applied, so it joins the history without manual steps.
flyway:
  datasources:
    default:
      enabled: true
      locations:
        - classpath:db/postgres
      baseline-on-migrate: true
      baseline-version: "0"
      connect-retries: 5

redis:
  uri: ${REDIS_URL:`redis://localhost:6379/0`}
  pool-size: ${REDIS_POOL_SIZE:16}
  connect-timeout: 2s
  socket-timeout: 2s
