micronaut:
  application:
    name: java-template
  server:
    port: ${SERVER_PORT:8080}
    max-request-size: 16MB
    cors:
      enabled: true
      configurations:
        default:
          allowed-origins:
            - "*"
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  metrics:
    enabled: true
    binders:
      jvm:
        enabled: true
      processor:
        enabled: true
      uptime:
        enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M

endpoints:
  prometheus:
    enabled: true
    sensitive: false
  # Our /metrics controller serves the Prometheus scrape; disable the management
  # JSON metrics endpoint so it does not collide on the /metrics path.
  metrics:
    enabled: false

template:
  app-title: "Template Micronaut Service"
  app-version: "1.0.0"
  app-description: "A Java Micronaut service mirroring the Python webservice template"
  status: "running"
  correlation-id-header: "X-Request-ID"
  health-check-timeout-seconds: 2.0
  max-request-body-bytes: 16777216
  mcp-name: "java-template"
  mcp-instructions: "Tools for this template application."

datasources:
  default:
    url: ${POSTGRES_URL:`jdbc:postgresql://localhost:5432/appdb`}
    username: ${POSTGRES_USER:appuser}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    minimum-idle: 2
    maximum-pool-size: 10
  clickhouse:
    url: ${CLICKHOUSE_URL:`jdbc:ch://localhost:8123/default`}
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    dialect: ANSI
    schema-generate: NONE

redis:
  uri: ${REDIS_URL:`redis://localhost:6379/0`}
