# Install once:  pip install -r requirements-dev.txt
#                pre-commit install --install-hooks && pre-commit install --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        entry: python run_CICD.py security gitleaks
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: fast
        name: format + lint (changed services)
        entry: python run_CICD.py changed fast --base HEAD
        language: system
        pass_filenames: false
        stages: [pre-push]
