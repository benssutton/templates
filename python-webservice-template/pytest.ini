[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    http_ingest: tests for the HTTP ingest endpoint
    observability: tests for the observability endpoints
    resilience: tests for startup resilience and connection retry behaviour
# Per-worker Postgres/ClickHouse/Redis (session fixtures); Solace tests share one
# worker (conftest). PYTEST_XDIST_AUTO_NUM_WORKERS overrides the count; -n 0 runs serially.
# Worker count measured on the 4-CPU/8 GB Docker Desktop VM (full suite + coverage):
# serial 167 s, -n 4 230 s, -n 3 301 s, -n 2 108-154 s (4 runs). More workers lose: each one starts its
# own three containers and the VM saturates, so the cap is 2.
addopts = -n auto --maxprocesses=2 --dist loadgroup
