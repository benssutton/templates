# Profiling override. Use alongside the base file:
#   docker compose -f docker-compose.yml -f docker-compose.profiling.yml up -d --build
#
# - SYS_PTRACE lets py-spy attach to the app process (Layer 2).
# - INGEST_TRANSPORT=noop: no stream source at all, so HTTP ingest is the sole
#   LSM writer during the ingest profile (single-writer contract) — see
#   tests/performance/profile_ingest.js.
services:
  app:
    cap_add:
      - SYS_PTRACE
    environment:
      INGEST_TRANSPORT: noop
