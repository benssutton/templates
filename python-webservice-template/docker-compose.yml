name: python-template

services:
  db:
    image: pgvector/pgvector:0.8.4-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./scripts/clickhouse-init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./tests/performance/data/clickhouse-seed.sh:/docker-entrypoint-initdb.d/02-seed.sh
      - ./tests/test_data/clickhouse_seed_data.ipc:/tmp/clickhouse_seed_data.ipc
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  solace:
    image: solace/solace-pubsub-standard:10.26.10
    ports:
      - "55555:55555"
      - "8080:8080"
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      # Minimum scaling tier (~1 GiB) so the broker fits a dev-sized Docker VM.
      system_scaling_maxconnectioncount: "100"
    # Solace POST hard requirement: nofile hard limit >= 1048576 (older
    # 2448:6592 values trigger a startup ERROR and immediate shutdown).
    shm_size: "1g"
    ulimits:
      core: -1
      nofile:
        soft: 1048576
        hard: 1048576
    # Readiness gate: the guaranteed-messaging health-check port returns 200
    # once the broker is active. (SEMP on 8080 returns 401 without auth, so it
    # is not a usable unauthenticated health probe.)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5550/health-check/guaranteed-active || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  solace-publisher:
    build: .
    command: ["python", "tests/performance/publishers/solace_publisher.py"]
    # The broker's health check reports active before the message VPN accepts
    # clients, and this demo publisher doesn't retry its connect: restart it.
    restart: on-failure
    environment:
      # Running a script puts its own folder on sys.path; the `tests.` imports
      # need the project root.
      PYTHONPATH: /app
      SOLACE_HOST: solace
      SOLACE_PORT: "55555"
      SOLACE_VPN: default
      SOLACE_USERNAME: admin
      SOLACE_PASSWORD: admin
      SOLACE_TOPIC: "ingest/batches"
      PUBLISH_INTERVAL: "0.1"
    depends_on:
      solace:
        condition: service_healthy

  app:
    build: .
    ports:
      # HTTPS on the default port, matching `python main.py` (Settings.server_port=443).
      - "443:443"
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-appdb}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      REDIS_URL: redis://redis:6379/0
      INGEST_TRANSPORT: ${INGEST_TRANSPORT:-solace}
      SOLACE_HOST: solace
      SOLACE_PORT: "55555"
      SOLACE_VPN: default
      SOLACE_USERNAME: admin
      SOLACE_PASSWORD: admin
      SOLACE_TOPIC: "ingest/batches"
      SOLACE_QUEUE: python-template/ingest
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      solace:
        condition: service_healthy
      # Solace is a required dependency (default transport): even with
      # INGEST_TRANSPORT=noop, `up app` starts the broker and waits for it.
      # For HTTP-only ingest without a broker, skip the dependency:
      #   docker compose up -d db clickhouse redis && INGEST_TRANSPORT=noop docker compose up -d --no-deps app
    healthcheck:
      # HTTPS with an unverified context — the cert is self-signed (dev only).
      test: ["CMD-SHELL", "python -c \"import ssl, urllib.request; urllib.request.urlopen('https://localhost/health/live', context=ssl._create_unverified_context())\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  prometheus:
    profiles: [observability]
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      app:
        condition: service_healthy

  grafana:
    profiles: [observability]
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
