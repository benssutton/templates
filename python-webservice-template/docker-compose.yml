name: python-template

# `docker compose up -d --build --wait` needs no host-side step: the one-shot
# `certs` service writes a self-signed dev certificate into the `certs` volume,
# which the app mounts read-only, so no key material is baked into the image.

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.10.4.207
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      # The app applies migrations itself at startup; the schema is also run here
      # so the seed script (performance-test data) has a table to load into.
      - ./migrations/clickhouse/001_create_items.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./tests/performance/data/clickhouse-seed.sh:/docker-entrypoint-initdb.d/02-seed.sh
      - ./tests/test_data/clickhouse_seed_data.ipc:/tmp/clickhouse_seed_data.ipc
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  solace:
    image: solace/solace-pubsub-standard:10.26.10
    ports:
      - "55555:55555"
      - "8080:8080"
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      # Minimum scaling tier (~1 GiB) so the broker fits a dev-sized Docker VM.
      system_scaling_maxconnectioncount: "100"
    # Solace POST hard requirement: nofile hard limit >= 1048576 (older
    # 2448:6592 values trigger a startup ERROR and immediate shutdown).
    shm_size: "1g"
    ulimits:
      core: -1
      nofile:
        soft: 1048576
        hard: 1048576
    # Readiness gate: the guaranteed-messaging health-check port returns 200
    # once the broker is active. (SEMP on 8080 returns 401 without auth, so it
    # is not a usable unauthenticated health probe.)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5550/health-check/guaranteed-active || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  solace-publisher:
    build: .
    command: ["python", "tests/performance/publishers/solace_publisher.py"]
    # The broker's health check reports active before the message VPN accepts
    # clients, and this demo publisher doesn't retry its connect: restart it.
    restart: on-failure
    # The image's HEALTHCHECK probes the app's HTTPS port, which this container
    # does not serve; without this, `compose up --wait` reports it unhealthy.
    healthcheck:
      disable: true
    volumes:
      # The image ships no tests; the demo publisher runs them from the checkout.
      - ./tests:/app/tests:ro
    environment:
      # Running a script puts its own folder on sys.path; the `tests.` imports
      # need the project root.
      PYTHONPATH: /app
      SOLACE_HOST: solace
      SOLACE_PORT: "55555"
      SOLACE_VPN: default
      SOLACE_USERNAME: admin
      SOLACE_PASSWORD: admin
      SOLACE_TOPIC: "ingest/batches"
      PUBLISH_INTERVAL: "0.1"
    depends_on:
      solace:
        condition: service_healthy

  # One-shot: writes the dev key/cert only if absent. Runs as root because a new
  # named volume is root-owned; the files are handed to the app user (uid 10001).
  certs:
    image: python:3.12.16-slim@sha256:191083cdf6c7bda8c76158983163ead5d5cf7b77cf3033e805bb0f5296f51b4b
    volumes:
      - certs:/certs
    entrypoint:
      - sh
      - -c
      - >-
        test -s /certs/key.pem && test -s /certs/cert.pem ||
        (openssl req -x509 -newkey rsa:4096 -nodes -days 365 -subj /CN=localhost
        -addext subjectAltName=DNS:localhost,DNS:app,IP:127.0.0.1
        -keyout /certs/key.pem -out /certs/cert.pem &&
        chown 10001:10001 /certs/key.pem /certs/cert.pem && chmod 600 /certs/key.pem)

  app:
    build: .
    ports:
      # The container listens on 8443 (Dockerfile); the host keeps the default HTTPS port.
      - "443:8443"
    volumes:
      - certs:/app/certs:ro
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-appdb}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      REDIS_URL: redis://redis:6379/0
      # The demo stack streams from Solace; the application default is noop.
      INGEST_TRANSPORT: solace
      SOLACE_HOST: solace
      SOLACE_PORT: "55555"
      SOLACE_VPN: default
      SOLACE_USERNAME: admin
      SOLACE_PASSWORD: admin
      SOLACE_TOPIC: "ingest/batches"
      SOLACE_QUEUE: python-template/ingest
      # /mcp Host allow-list: the published port (localhost, 127.0.0.1) and the
      # compose service name (app), as other containers (k6) address it. JSON
      # array or comma-separated.
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,app
    depends_on:
      certs:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      solace:
        condition: service_healthy
    # Health check: the image's HEALTHCHECK (GET /health/live on 8443).

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.8.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      app:
        condition: service_healthy

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  certs:
