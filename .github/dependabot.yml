# The only scheduled automation in this repo. Monthly, grouped, 7-day cooldown on fresh releases.
version: 2
updates:
  - package-ecosystem: pip
    directory: /python-webservice-template
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }

  - package-ecosystem: maven
    directory: /java-webservice-template
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }
    groups: { java: { patterns: ["*"], update-types: [minor, patch] } }
    # Dependabot runs the Maven wrapper updater on its own JDK 21, which cannot load the
    # JDK 25 micronaut-maven-plugin extension, so these two fail (misconfigured_tooling).
    # Bump .mvn/wrapper/maven-wrapper.properties by hand.
    ignore:
      - { dependency-name: "org.apache.maven:apache-maven" }
      - { dependency-name: "org.apache.maven.wrapper:maven-wrapper" }

  - package-ecosystem: cargo
    directory: /rust-webservice-template
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }
    groups: { rust: { patterns: ["*"], update-types: [minor, patch] } }

  - package-ecosystem: docker
    directory: /python-webservice-template
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /java-webservice-template
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }
    groups: { actions: { patterns: ["*"] } }
