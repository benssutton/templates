name: Rust service
on:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    name: Rust (fmt + clippy + test + coverage + image + k6 smoke + deny)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # tests/it/smf_interop.rs publishes over SMF with Python's Solace SDK.
      # Ranges mirror python-webservice-template/requirements.in: keep them in sync.
      - run: python -m pip install "solace-pubsubplus>=1.11,<2.0" "pyarrow>=26.0.1,<27.0"
      # Installs the channel and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: rust-webservice-template
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust-webservice-template
          cache-on-failure: true
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov,cargo-deny
      - run: python run_CICD.py rust ci
