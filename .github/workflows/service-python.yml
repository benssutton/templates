name: Python service
on:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    name: Python (fast + test + image + k6 smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-webservice-template/requirements*.txt
      - run: python -m pip install -r python-webservice-template/requirements.txt -r python-webservice-template/requirements-dev.txt pytest-cov
      - run: python run_CICD.py python ci
